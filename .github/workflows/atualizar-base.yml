name: Atualizar Base Cientifica (PubChem)

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Extrair dados atualizados do PubChem (NIH)
        run: node scripts/atualizar_base_cientifica.mjs
      - name: Salvar alteracoes se houver novidade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/base_cientifica_pubchem.json
          git diff --staged --quiet || git commit -m "chore(data): atualiza base cientifica via PubChem"
          git push
