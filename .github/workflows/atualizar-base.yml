name: Atualizar Base Cientifica (PubChem)

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Extrair dados atualizados do PubChem (NIH)
        run: node scripts/atualizar_base_cientifica.mjs
      - name: Criar Pull Request com atualizacao da base cientifica
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(data): atualiza base cientifica via PubChem"
          branch: chore/atualizar-base-pubchem
          delete-branch: true
          title: "chore(data): atualizar base científica (PubChem)"
          body: |
            Atualização automática da base científica offline (`src/data/base_cientifica_pubchem.json`) via PubChem PUG REST API.

            Revise o diff antes de aprovar o merge em `main`.
          add-paths: src/data/base_cientifica_pubchem.json
